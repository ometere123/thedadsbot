name: Bootstrap TheDadBot

on:
  push:
    paths:
      - '.bootstrap.ready'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Expand release tree
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode | gzip -dc > /tmp/thedadbot-release.json
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = JSON.parse(fs.readFileSync('/tmp/thedadbot-release.json', 'utf8'));
          for (const [name, content] of Object.entries(files)) {
            const target = path.resolve(name);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, content);
          }
          console.log(`expanded ${Object.keys(files).length} TheDadBot files`);
          NODE
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Node/security checks
        run: npm run check
      - name: Canonical Solidity formatting
        run: forge fmt
      - name: Verify Solidity formatting
        run: forge fmt --check
      - name: Solidity tests
        run: forge test -vvv
      - name: Commit validated integrated release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git restore --staged .bootstrap .bootstrap.ready .github/workflows/bootstrap.yml
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 0
          fi
          git commit -m "Build TheDadBot integrated release"
          git push
