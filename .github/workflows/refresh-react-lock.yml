name: Refresh React lockfile

on:
  push:
    branches: [react-dashboard-migration]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.head_commit.message != 'Refresh lockfile for React dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-dashboard-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh lockfile for React dashboard'
          git push origin HEAD:react-dashboard-migration
