name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Build distributable archive
        run: |
          tar --exclude='.git' --exclude='node_modules' -czf thedadbot-${GITHUB_REF_NAME}.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: thedadbot-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
